// Vela Rules: a Paper/Spigot plugin that switches Vela client functions off for the players on a server.
// Built on its own, with the mod's wrapper:  ../gradlew -p server-plugin build
plugins {
    id 'java'
}

group = 'dev.sqwat'
version = '1.0.0'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    // Only the Bukkit API is used, so the plugin runs on Spigot and Paper from 1.20.5 on (Java 21).
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') { expand 'version': project.version }
}

test {
    useJUnitPlatform()
}
